<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Hearthbook — a house whose hearth burns a stepped block flame</title>

  <!-- Rounded black tile: matches the app's 22px-radius geometry at icon scale. -->
  <rect width="512" height="512" rx="112" fill="#0E0E0E"/>

  <!-- Chimney, set behind the gable with a gap so the two shapes stay distinct. -->
  <g id="chimney">
    <rect x="344" y="112" width="52" height="120" rx="14" fill="#E2FB4F"/>
  </g>
  <rect x="330" y="112" width="16" height="120" fill="#0E0E0E"/>

  <!-- House: gable + body, inset so the tile keeps a comfortable margin. -->
  <g id="house">
    <path d="M256 74 L436 206 a18 18 0 0 1 8 15 V420 a26 26 0 0 1-26 26 H94 a26 26 0 0 1-26-26 V221 a18 18 0 0 1 8-15 Z"
          fill="#E2FB4F"/>
  </g>

  <!-- Hearth: the opening, open at the base so the flame sits in the fire. -->
  <g id="hearth">
    <path d="M148 286 h216 v160 H148 Z M148 286 a22 22 0 0 1 22-22 h172 a22 22 0 0 1 22 22"
          fill="#0E0E0E"/>
    <rect x="148" y="286" width="216" height="160" fill="#0E0E0E"/>
    <rect x="148" y="264" width="216" height="44" rx="22" fill="#0E0E0E"/>
  </g>

  <!-- Flame: three stacked steps, widest at the base, salmon tip. -->
  <g id="flame">
    <rect x="234" y="310" width="44" height="54" rx="12" fill="#E98D7C"/>
    <rect x="202" y="352" width="108" height="52" rx="14" fill="#E2FB4F"/>
    <rect x="174" y="394" width="164" height="52" rx="16" fill="#E2FB4F"/>
  </g>
</svg>
