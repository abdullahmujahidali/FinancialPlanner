<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Hearthbook — a brutalist house whose hearth burns a stepped block flame</title>

  <!-- Black field: reads as a solid app-icon tile and keeps the lime as accent. -->
  <rect width="512" height="512" fill="#0A0A0A"/>

  <!-- Chimney sits behind the gable, separated by a black gap so the two
       shapes stay distinct instead of merging into one blob when scaled down. -->
  <g id="chimney">
    <rect x="352" y="96" width="56" height="132" fill="#E2FB4F"/>
  </g>
  <rect x="336" y="96" width="16" height="132" fill="#0A0A0A"/>

  <!-- House: lime gable + body, inset so the tile keeps a black margin. -->
  <g id="house">
    <polygon points="256,40 472,200 472,472 40,472 40,200" fill="#E2FB4F"/>
  </g>

  <!-- Hearth: a black opening cut into the house. Its floor is left open at the
       bottom so the flame sits IN the fire, not on a shelf. -->
  <g id="hearth">
    <rect x="120" y="260" width="272" height="212" fill="#0A0A0A"/>
  </g>

  <!-- Flame: three stacked steps, widest at the base, narrowing to a salmon tip.
       Gaps on both sides keep it clear of the hearth walls. -->
  <g id="flame">
    <rect x="232" y="300" width="48" height="56" fill="#E98D7C"/>
    <rect x="200" y="356" width="112" height="56" fill="#E2FB4F"/>
    <rect x="168" y="412" width="176" height="60" fill="#E2FB4F"/>
  </g>
</svg>
