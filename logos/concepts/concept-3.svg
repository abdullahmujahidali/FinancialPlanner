<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Hearthbook — an open ledger book with a black spine, thick ledger rules on the left page and rules stepping up like a bar chart on the right</title>

  <g id="icon">
    <rect id="field" x="0" y="0" width="512" height="512" fill="#0A0A0A"/>

    <g id="book">
      <rect id="book-slab" x="40" y="88" width="432" height="336" fill="#E2FB4F"/>

      <g id="left-page">
        <rect x="76" y="140" width="148" height="28" fill="#0A0A0A"/>
        <rect x="76" y="196" width="148" height="28" fill="#0A0A0A"/>
        <rect x="76" y="252" width="148" height="28" fill="#0A0A0A"/>
        <rect x="76" y="308" width="148" height="28" fill="#0A0A0A"/>
      </g>

      <g id="right-page-bars">
        <rect x="288" y="308" width="40" height="28" fill="#0A0A0A"/>
        <rect x="288" y="252" width="80" height="28" fill="#0A0A0A"/>
        <rect x="288" y="196" width="120" height="28" fill="#E98D7C"/>
        <rect x="288" y="140" width="148" height="28" fill="#0A0A0A"/>
      </g>

      <rect id="spine" x="240" y="88" width="32" height="336" fill="#0A0A0A"/>
      <rect id="book-border-top" x="40" y="88" width="432" height="16" fill="#0A0A0A"/>
      <rect id="book-border-bottom" x="40" y="408" width="432" height="16" fill="#0A0A0A"/>
    </g>

    <g id="base">
      <rect x="40" y="440" width="432" height="32" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
