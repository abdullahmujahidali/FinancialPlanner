<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Hearthbook — a geometric capital H built from stacked ledger bars in acid lime on a hard black field</title>

  <g id="icon">
    <g id="field">
      <rect x="0" y="0" width="512" height="512" fill="#0A0A0A"/>
      <rect x="24" y="24" width="464" height="464" fill="#FFFFFF"/>
      <rect x="40" y="40" width="432" height="432" fill="#0A0A0A"/>
    </g>

    <g id="letter-h">
      <rect x="88" y="88" width="88" height="336" fill="#E2FB4F"/>
      <rect x="336" y="88" width="88" height="336" fill="#E2FB4F"/>
      <rect x="176" y="224" width="160" height="72" fill="#E2FB4F"/>
    </g>

    <g id="ledger-rules">
      <rect x="88" y="168" width="88" height="14" fill="#0A0A0A"/>
      <rect x="336" y="168" width="88" height="14" fill="#0A0A0A"/>
      <rect x="88" y="344" width="88" height="14" fill="#0A0A0A"/>
      <rect x="336" y="344" width="88" height="14" fill="#0A0A0A"/>
    </g>

    <g id="baseline-bars">
      <rect x="176" y="296" width="44" height="52" fill="#E98D7C"/>
      <rect x="236" y="296" width="44" height="88" fill="#FFFFFF"/>
      <rect x="296" y="296" width="40" height="36" fill="#E2FB4F"/>
    </g>
  </g>
</svg>
